name: Install age
description: Installs the pinned age and age-keygen binaries after verifying the release tarball's SHA-256.
runs:
  using: composite
  steps:
    - name: Download, verify and install age
      shell: bash
      env:
        AGE_VERSION: v1.3.2
        # SHA-256 of age-v1.3.2-linux-amd64.tar.gz, recorded on 14 October 2026 (see terraform-ci.md).
        AGE_SHA256: cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10
      run: |
        set -euo pipefail
        archive="$RUNNER_TEMP/age.tar.gz"
        curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
          --output "$archive" \
          "https://github.com/FiloSottile/age/releases/download/${AGE_VERSION}/age-${AGE_VERSION}-linux-amd64.tar.gz"
        echo "${AGE_SHA256}  ${archive}" | sha256sum --check --strict -
        mkdir -p "$RUNNER_TEMP/age-bin"
        # Only the two binaries are installed; no plugins, so only native X25519 recipients work.
        tar -xzf "$archive" -C "$RUNNER_TEMP" age/age age/age-keygen
        install -m 0755 "$RUNNER_TEMP/age/age" "$RUNNER_TEMP/age/age-keygen" "$RUNNER_TEMP/age-bin/"
        rm -rf "$archive" "$RUNNER_TEMP/age"
        echo "$RUNNER_TEMP/age-bin" >> "$GITHUB_PATH"
