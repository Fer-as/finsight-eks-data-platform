# Pipeline 2 (G07): application tests, Checkov, production images with a Trivy gate, and on main
# publication to ECR plus a GitOps pull request with the new image tags and digests. Argo CD deploys
# after that pull request is merged; nothing here talks to the cluster.
# Pull requests never receive AWS credentials. See docs/infrastructure/app-pipeline.md.
name: Application

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/**"
      - "pipelines/**"
      - "tests/**"
      - "config/**"
      - "warehouse/migrations/**"
      - "scripts/migrate.py"
      - "pyproject.toml"
      - "requirements.lock"
      - "requirements-dev.lock"
      - ".dockerignore"
      # The chart, but not image-tags.yaml: a merged image-tag pull request must not publish again.
      - "gitops/apps/finsight/Chart.yaml"
      - "gitops/apps/finsight/values.yaml"
      - "gitops/apps/finsight/templates/**"
      - "gitops/platform/cluster-issuers/**"
      - "infra/checkov-image.txt"
      - ".github/workflows/app.yml"
  push:
    branches: [main]
    # Same list as pull_request (written out: some scanners do not resolve YAML anchors).
    paths:
      - "apps/**"
      - "pipelines/**"
      - "tests/**"
      - "config/**"
      - "warehouse/migrations/**"
      - "scripts/migrate.py"
      - "pyproject.toml"
      - "requirements.lock"
      - "requirements-dev.lock"
      - ".dockerignore"
      - "gitops/apps/finsight/Chart.yaml"
      - "gitops/apps/finsight/values.yaml"
      - "gitops/apps/finsight/templates/**"
      - "gitops/platform/cluster-issuers/**"
      - "infra/checkov-image.txt"
      - ".github/workflows/app.yml"

permissions: {}

# A newer push to a pull request cancels its superseded run. Each main run gets its own group, so a
# publishing run is never cancelled.
concurrency:
  group: app-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  ECR_REPOSITORY_PREFIX: finsight-dev
  TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
  HELM_IMAGE: alpine/helm:3.22.0@sha256:70ed3f7b02ab2eee12aa520ad6870305db8a82516b07aff62f5656c657a26e2a

jobs:
  python:
    name: Python lint and tests (PostgreSQL integration)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_DB: finsight_test
          POSTGRES_USER: finsight_test
          POSTGRES_PASSWORD: disposable_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finsight_test -d finsight_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      FINSIGHT_INTEGRATION: "1"
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: finsight_test
      PGUSER: finsight_test
      PGPASSWORD: disposable_test_only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked dependencies
        run: python -m pip install -r requirements-dev.lock
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Pytest (unit and integration)
        run: python -m pytest -q -p no:cacheprovider

  frontend:
    name: Frontend format, tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  checkov:
    name: Checkov (Terraform, Dockerfiles, rendered Kubernetes)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Placeholder repositories and digests: only the manifest structure is scanned.
      - name: Render FinSight Kubernetes manifests
        run: |
          mkdir -p "$RUNNER_TEMP/rendered"
          digest="sha256:$(printf '0%.0s' {1..64})"
          docker run --rm --network none -v "$PWD:/work:ro" -v "$RUNNER_TEMP/rendered:/out" -w /work --entrypoint sh "$HELM_IMAGE" -c "
            helm template finsight gitops/apps/finsight -n finsight --kube-version 1.36.0 \
              --set api.image.repository=registry.invalid/api --set api.image.digest=$digest \
              --set frontend.image.repository=registry.invalid/frontend --set frontend.image.digest=$digest \
              --set etl.image.repository=registry.invalid/etl --set etl.image.digest=$digest \
              --set ingress.tls.enabled=true > /out/finsight.yaml &&
            helm template cluster-issuers gitops/platform/cluster-issuers -n cert-manager --kube-version 1.36.0 \
              --set route53.hostedZoneID=Z0000000000000000000 > /out/cluster-issuers.yaml"
      - name: Checkov
        run: |
          image="$(tr -d '[:space:]' < infra/checkov-image.txt)"
          docker pull --quiet "$image"
          status=0
          run() { docker run --rm --network none -v "$PWD:/src:ro" -v "$RUNNER_TEMP/rendered:/rendered:ro" "$image" --skip-download --compact --quiet "$@" || status=1; }
          run -d /src/infra/terraform --framework terraform --download-external-modules false
          run -d /src/apps --framework dockerfile
          run -d /rendered --framework kubernetes
          exit "$status"

  images:
    name: Build and scan ${{ matrix.name }} image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
            target: api
          - name: etl
            dockerfile: apps/api/Dockerfile
            target: etl
          - name: frontend
            dockerfile: apps/frontend/Dockerfile
            target: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        env:
          NAME: ${{ matrix.name }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          TARGET: ${{ matrix.target }}
        run: |
          docker build --file "$DOCKERFILE" --target "$TARGET" --tag "finsight-$NAME:$GITHUB_SHA" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" .
          docker save --output "$RUNNER_TEMP/image.tar" "finsight-$NAME:$GITHUB_SHA"
      # Findings with no fixed version cannot be remediated by rebuilding; they are reported in
      # the summary below, not hidden, and do not block.
      - name: Trivy gate (fixable HIGH/CRITICAL fail the job)
        run: |
          docker run --rm -v "$RUNNER_TEMP:/scan" "$TRIVY_IMAGE" image --quiet --input /scan/image.tar \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --format table
      - name: Trivy report (all HIGH/CRITICAL, including unfixed)
        if: always()
        env:
          NAME: ${{ matrix.name }}
        run: |
          {
            echo "## Trivy: $NAME (HIGH/CRITICAL, including findings with no fix)"
            echo '```'
            docker run --rm -v "$RUNNER_TEMP:/scan" "$TRIVY_IMAGE" image --quiet --input /scan/image.tar \
              --severity HIGH,CRITICAL --format table --exit-code 0 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # Only main publishes, and it publishes exactly these scanned bytes.
      - name: Keep the scanned image for publishing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ matrix.name }}
          path: ${{ runner.temp }}/image.tar
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish images to ECR (OIDC)
    needs: [python, frontend, checkov, images]
    # Off until the protected dev-images environment exists (repository variable switch), so this
    # job never makes GitHub auto-create an unprotected environment.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.IMAGE_PUBLISHING_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: dev-images
    permissions:
      contents: read
      id-token: write
    outputs:
      api_digest: ${{ steps.push.outputs.api_digest }}
      etl_digest: ${{ steps.push.outputs.etl_digest }}
      frontend_digest: ${{ steps.push.outputs.frontend_digest }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-*
          path: ${{ runner.temp }}/images
          digest-mismatch: error
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-west-2
          role-session-name: finsight-images-${{ github.run_id }}
          role-duration-seconds: 1800
          mask-aws-account-id: true
      # ECR repositories are IMMUTABLE: an existing commit tag is never overwritten (re-runs reuse it).
      - name: Push commit-tagged images
        id: push
        run: |
          set -euo pipefail
          registry="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.eu-west-2.amazonaws.com"
          aws ecr get-login-password --region eu-west-2 | docker login --username AWS --password-stdin "$registry"
          for name in api etl frontend; do
            docker load --input "$RUNNER_TEMP/images/image-$name/image.tar"
            repo="$ECR_REPOSITORY_PREFIX/$name"
            if aws ecr describe-images --repository-name "$repo" --image-ids "imageTag=$GITHUB_SHA" >/dev/null 2>&1; then
              echo "$repo:$GITHUB_SHA already exists (immutable); not pushing again"
            else
              docker tag "finsight-$name:$GITHUB_SHA" "$registry/$repo:$GITHUB_SHA"
              docker push "$registry/$repo:$GITHUB_SHA"
            fi
            digest="$(aws ecr describe-images --repository-name "$repo" --image-ids "imageTag=$GITHUB_SHA" --query 'imageDetails[0].imageDigest' --output text)"
            echo "${name}_digest=$digest" >> "$GITHUB_OUTPUT"
            echo "- $name: tag \`$GITHUB_SHA\`, digest \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
          done

  gitops:
    name: Propose the new image versions (GitOps pull request)
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # No AWS access. Pushes a branch and opens a pull request; never pushes to main.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Write image-tags.yaml
        env:
          API_DIGEST: ${{ needs.publish.outputs.api_digest }}
          ETL_DIGEST: ${{ needs.publish.outputs.etl_digest }}
          FRONTEND_DIGEST: ${{ needs.publish.outputs.frontend_digest }}
        run: |
          set -euo pipefail
          for d in "$API_DIGEST" "$ETL_DIGEST" "$FRONTEND_DIGEST"; do
            [[ "$d" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Unexpected digest from publish job"; exit 1; }
          done
          head -n 4 gitops/apps/finsight/image-tags.yaml > "$RUNNER_TEMP/tags.yaml"
          for name in api frontend etl; do
            var="${name^^}_DIGEST"
            printf '%s:\n  image:\n    tag: "%s"\n    digest: "%s"\n' "$name" "$GITHUB_SHA" "${!var}" >> "$RUNNER_TEMP/tags.yaml"
          done
          mv "$RUNNER_TEMP/tags.yaml" gitops/apps/finsight/image-tags.yaml
      - name: Open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="gitops/images-$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$branch"
          git commit --all --message "chore(gitops): deploy images ${GITHUB_SHA::7}"
          git push origin "$branch"
          if ! gh pr create --base main --head "$branch" \
            --title "chore(gitops): deploy images ${GITHUB_SHA::7}" \
            --body "Image tags and digests published from $GITHUB_SHA by run $GITHUB_RUN_ID. Merging lets Argo CD roll out the change."; then
            echo "::error::Could not open the pull request. Enable Settings > Actions > General > 'Allow GitHub Actions to create and approve pull requests', or open one from branch $branch by hand."
            exit 1
          fi
