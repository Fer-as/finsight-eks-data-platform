name: Workflow policy

# Read-only checks for changes to the workflows themselves, including terraform-apply.yml, which is
# started only by hand and so is never exercised by a pull request. No plan, apply, AWS credentials,
# OIDC token or image publishing: the workflows are read as files, and the saved-plan protection is
# tested with synthetic fixtures and throwaway keys.
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - "scripts/ci/**"
      - "scripts/check-workflows.py"

# Nothing by default; each job grants only what it needs.
permissions: {}

concurrency:
  group: workflow-policy-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: "1.16.2"

jobs:
  policy:
    name: Workflow security policy and Checkov
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The digest-pinned Checkov image also provides the Python and PyYAML the policy script uses.
      - name: Pull the digest-pinned Checkov image
        run: docker pull --quiet "$(tr -d '[:space:]' < infra/checkov-image.txt)"
      - name: Check the workflow security policy
        run: |
          image="$(tr -d '[:space:]' < infra/checkov-image.txt)"
          policy() { docker run --rm --network none -v "$PWD:/repo:ro" -w /repo \
            -e PYTHONDONTWRITEBYTECODE=1 --entrypoint python "$image" scripts/check-workflows.py "$@"; }
          policy
          policy --self-test
      - name: Checkov (GitHub Actions)
        run: |
          image="$(tr -d '[:space:]' < infra/checkov-image.txt)"
          docker run --rm --network none -v "$PWD:/src:ro" "$image" -d /src/.github \
            --framework github_actions --skip-download --compact --quiet

  plan-protection:
    name: Saved-plan protection tests (synthetic, no AWS)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Install age
        uses: ./.github/actions/install-age
      # The same synthetic tests as terraform.yml's checks job: they exercise the scripts the
      # approval-gated apply uses to encrypt, verify and refuse plans.
      - name: Run plan protection security tests
        shell: pwsh
        run: ./scripts/ci/tests/plan-protection.tests.ps1
