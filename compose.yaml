name: finsight

x-python: &python
  build:
    context: .
    dockerfile: apps/api/Dockerfile
    target: runtime
  # Migrations, data generation and the ETL connect as the writer role, never as the administrator.
  environment: &writer-env
    PGHOST: postgres
    PGPORT: 5432
    PGDATABASE: ${POSTGRES_DB:-finsight}
    PGUSER: ${FINSIGHT_WRITER_ROLE:-finsight_app}
    PGPASSWORD: ${FINSIGHT_WRITER_PASSWORD:?Copy .env.example to .env first}
  cpus: ${SERVICE_CPUS:-1.0}
  mem_limit: ${PIPELINE_MEMORY:-1g}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finsight}
      POSTGRES_USER: ${POSTGRES_USER:-finsight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    cpus: ${SERVICE_CPUS:-1.0}
    mem_limit: ${POSTGRES_MEMORY:-512m}

  # The only service that connects as the administrator: creates or updates the writer and reader
  # roles (scripts/bootstrap_roles.py), then exits.
  roles:
    <<: *python
    command: ["python", "scripts/bootstrap_roles.py"]
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-finsight}
      PGUSER: ${POSTGRES_USER:-finsight}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
      FINSIGHT_WRITER_ROLE: ${FINSIGHT_WRITER_ROLE:-finsight_app}
      FINSIGHT_WRITER_PASSWORD: ${FINSIGHT_WRITER_PASSWORD:?Copy .env.example to .env first}
      FINSIGHT_READER_ROLE: ${FINSIGHT_READER_ROLE:-finsight_api}
      FINSIGHT_READER_PASSWORD: ${FINSIGHT_READER_PASSWORD:?Copy .env.example to .env first}
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    <<: *python
    command: ["python", "scripts/migrate.py"]
    depends_on:
      roles:
        condition: service_completed_successfully

  generate:
    <<: *python
    command: ["python", "-m", "finsight_pipelines.synthetic"]
    volumes:
      - ./data:/app/data

  etl:
    <<: *python
    command: ["python", "-m", "finsight_pipelines.etl"]
    volumes:
      - ./data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      generate:
        condition: service_completed_successfully

  api:
    <<: *python
    # Read-only reader role: SELECT on curated and ops only.
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-finsight}
      PGUSER: ${FINSIGHT_READER_ROLE:-finsight_api}
      PGPASSWORD: ${FINSIGHT_READER_PASSWORD:?Copy .env.example to .env first}
    mem_limit: ${API_MEMORY:-256m}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      etl:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready')"]
      interval: 5s
      timeout: 4s
      retries: 15

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      target: development
    environment:
      API_PROXY_TARGET: http://api:8000
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 15
    cpus: ${SERVICE_CPUS:-1.0}
    mem_limit: ${FRONTEND_MEMORY:-256m}

  test-db:
    profiles: ["test"]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: finsight_test
      POSTGRES_USER: finsight_test
      POSTGRES_PASSWORD: disposable_test_only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finsight_test -d finsight_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: test
    environment:
      PGHOST: test-db
      PGPORT: 5432
      PGDATABASE: finsight_test
      PGUSER: finsight_test
      PGPASSWORD: disposable_test_only
      FINSIGHT_INTEGRATION: "1"
    depends_on:
      test-db:
        condition: service_healthy

  frontend-test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      target: test

volumes:
  postgres-data:
