apiVersion: apps/v1
kind: Deployment
metadata:
  name: finsight-api
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: finsight-api
    {{- include "finsight.labels" . | nindent 4 }}
  annotations:
    # After PostgreSQL (wave -1) and the database init Job (wave 0) when database.enabled.
    argocd.argoproj.io/sync-wave: "1"
    checkov.io/skip1: CKV_K8S_35=libpq reads PG* environment variables; secret-file delivery needs an application change (R5 hardening)
    checkov.io/skip2: CKV2_K8S_6=VPC CNI network-policy enforcement is not enabled in this cluster yet (R5 hardening, #17)
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: finsight-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: finsight-api
        {{- include "finsight.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- include "finsight.podSecurity" .Values.api | nindent 6 }}
      containers:
        - name: api
          image: {{ include "finsight.image" .Values.api.image | quote }}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          envFrom:
            - secretRef:
                name: {{ required "api.databaseSecretName is required" .Values.api.databaseSecretName }}
          {{- if .Values.database.enabled }}
          # The in-cluster database Service; overrides any PGHOST/PGPORT in the Secret.
          env:
            - name: PGHOST
              value: finsight-postgres
            - name: PGPORT
              value: "5432"
          {{- end }}
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          {{- include "finsight.containerSecurity" . | nindent 10 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: finsight-api
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: finsight-api
    {{- include "finsight.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: finsight-api
  ports:
    - name: http
      port: 80
      targetPort: http
