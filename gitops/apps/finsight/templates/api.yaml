apiVersion: apps/v1
kind: Deployment
metadata:
  name: finsight-api
  labels:
    app.kubernetes.io/name: finsight-api
    {{- include "finsight.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: finsight-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: finsight-api
        {{- include "finsight.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- include "finsight.podSecurity" . | nindent 6 }}
      containers:
        - name: api
          image: "{{ required "api.image.repository is required" .Values.api.image.repository }}:{{ required "api.image.tag is required" .Values.api.image.tag }}"
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          {{- include "finsight.containerSecurity" . | nindent 10 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: finsight-api
  labels:
    app.kubernetes.io/name: finsight-api
    {{- include "finsight.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: finsight-api
  ports:
    - name: http
      port: 80
      targetPort: http
