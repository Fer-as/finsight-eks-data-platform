# One host. "/" is an exact match and the built assets live under /assets (the frontend has no
# client-side routes), so any other path gets F5 NGINX's own 404 (G03.4). /api goes to FastAPI,
# whose routes already start with /api, so no rewrite is needed.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: finsight
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "finsight.labels" . | nindent 4 }}
  {{- if .Values.ingress.tls.enabled }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.clusterIssuer | quote }}
    cert-manager.io/renew-before: {{ .Values.ingress.tls.renewBefore | quote }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ required "ingress.host is required" .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: finsight-api
                port:
                  name: http
          - path: /assets
            pathType: Prefix
            backend:
              service:
                name: finsight-frontend
                port:
                  name: http
          - path: /
            pathType: Exact
            backend:
              service:
                name: finsight-frontend
                port:
                  name: http
