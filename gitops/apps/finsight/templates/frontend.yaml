apiVersion: apps/v1
kind: Deployment
metadata:
  name: finsight-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: finsight-frontend
    {{- include "finsight.labels" . | nindent 4 }}
  annotations:
    checkov.io/skip1: CKV2_K8S_6=VPC CNI network-policy enforcement is not enabled in this cluster yet (R5 hardening, #17)
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: finsight-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: finsight-frontend
        {{- include "finsight.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- include "finsight.podSecurity" .Values.frontend | nindent 6 }}
      containers:
        - name: frontend
          image: {{ include "finsight.image" .Values.frontend.image | quote }}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: {{ .Values.frontend.port }}
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          {{- include "finsight.containerSecurity" . | nindent 10 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: finsight-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: finsight-frontend
    {{- include "finsight.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: finsight-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
