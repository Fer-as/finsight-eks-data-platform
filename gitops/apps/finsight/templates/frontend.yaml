apiVersion: apps/v1
kind: Deployment
metadata:
  name: finsight-frontend
  labels:
    app.kubernetes.io/name: finsight-frontend
    {{- include "finsight.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: finsight-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: finsight-frontend
        {{- include "finsight.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- include "finsight.podSecurity" . | nindent 6 }}
      containers:
        - name: frontend
          image: "{{ required "frontend.image.repository is required" .Values.frontend.image.repository }}:{{ required "frontend.image.tag is required" .Values.frontend.image.tag }}"
          ports:
            - name: http
              containerPort: {{ .Values.frontend.port }}
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          {{- include "finsight.containerSecurity" . | nindent 10 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: finsight-frontend
  labels:
    app.kubernetes.io/name: finsight-frontend
    {{- include "finsight.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: finsight-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
