# Image repositories include the account's ECR registry, so they are set at install time
# (foundation output repository_urls); the chart refuses to render without them. Tags and digests
# come from image-tags.yaml, which the application pipeline updates through a pull request.
api:
  image:
    repository: ""
    tag: ""
    digest: ""
  runAsUser: 10001
  replicas: 1
  port: 8000
  # Existing Secret with PGHOST, PGPORT, PGDATABASE, PGUSER and PGPASSWORD (libpq variables the
  # image reads). Created with the database (later task); never stored in this repository.
  databaseSecretName: finsight-database
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Production frontend image (apps/frontend/Dockerfile target production): built static assets on
# unprivileged NGINX (UID 101), port 8080.
frontend:
  image:
    repository: ""
    tag: ""
    digest: ""
  # NGINX image (default UID 101) also runs as an arbitrary high UID; tested.
  runAsUser: 10101
  replicas: 1
  port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# One-shot database initialisation (migrations, deterministic synthetic data, ETL) using the
# published ETL image. Runs as an Argo CD Sync hook after PostgreSQL is Ready and before the API.
etl:
  image:
    repository: ""
    tag: ""
    digest: ""
  runAsUser: 10001
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

# PostgreSQL 17 inside the cluster: one replica on an encrypted gp3 EBS volume (EBS CSI driver),
# reachable only through the ClusterIP Service finsight-postgres. Credentials come from the same
# Secret as the API (api.databaseSecretName: PGDATABASE, PGUSER, PGPASSWORD); the chart sets
# PGHOST/PGPORT itself. Single replica and zonal volume: an assessment compromise, not HA.
database:
  enabled: true
  # Same image and digest as the CI integration-test service (.github/workflows/app.yml).
  image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
  # Arbitrary high UID (the image supports any UID with a writable data directory; tested with
  # a read-only root filesystem and an fsGroup-owned volume, including a restart on existing data).
  runAsUser: 10070
  storage: 5Gi
  storageClass:
    create: true
    name: finsight-gp3
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
ingress:
  className: nginx
  host: eks.feras-dev.co.uk
  # G04: turn on after cert-manager and its ClusterIssuers exist. With TLS configured, F5 NGINX
  # redirects HTTP to HTTPS by default (ConfigMap key ssl-redirect).
  tls:
    enabled: false
    secretName: finsight-tls
    clusterIssuer: letsencrypt-staging
    # cert-manager renews this long before expiry (Let's Encrypt certificates last 90 days).
    renewBefore: 720h

# G05: ServiceMonitor for the API's /metrics, alert rules and the Grafana dashboard
# (dashboards/finsight.json). Needs the monitoring stack's CRDs (monitoring Application, wave 1).
monitoring:
  enabled: true
  scrapeInterval: 30s
