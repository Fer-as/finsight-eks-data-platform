# Image repositories include the account's ECR registry, so they are set at install time
# (foundation output repository_urls); the chart refuses to render without them.
api:
  image:
    repository: ""
    tag: ""
  replicas: 1
  port: 8000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

# Needs the production frontend image (R5.7): built static assets served by an unprivileged
# web server on port 8080. The current frontend Dockerfile has only a development stage.
frontend:
  image:
    repository: ""
    tag: ""
  replicas: 1
  port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

ingress:
  className: nginx
  host: eks.feras-dev.co.uk
  # G04: turn on after cert-manager and its ClusterIssuers exist. With TLS configured, F5 NGINX
  # redirects HTTP to HTTPS by default (ConfigMap key ssl-redirect).
  tls:
    enabled: false
    secretName: finsight-tls
    clusterIssuer: letsencrypt-staging
    # cert-manager renews this long before expiry (Let's Encrypt certificates last 90 days).
    renewBefore: 720h
