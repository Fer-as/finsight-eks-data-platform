# Root Application (app of apps, G08). Applied once, by hand, after Argo CD is installed; it then
# keeps every child Application in gitops/kustomization.yaml in sync with main.
#
# The child files carry REPLACE_WITH_* placeholders because the real values identify AWS resources
# in this account and are not committed. The patches below replace them in the cluster only. Each
# patch first tests the parameter name and placeholder, so a reordered child file fails the build
# instead of patching the wrong field. The __*__ tokens are filled by
# scripts/render-argocd-root.ps1, which validates each value and refuses to output any token left.
# Never commit the rendered file.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: finsight-root
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  source:
    repoURL: https://github.com/Fer-as/finsight-eks-data-platform.git
    targetRevision: main
    path: gitops
    kustomize:
      patches:
        - target:
            group: argoproj.io
            kind: Application
            name: aws-load-balancer-controller
          patch: |-
            - op: test
              path: /spec/sources/0/helm/parameters/0
              value: {name: vpcId, value: REPLACE_WITH_VPC_ID}
            - op: replace
              path: /spec/sources/0/helm/parameters/0/value
              value: "__VPC_ID__"
        - target:
            group: argoproj.io
            kind: Application
            name: cluster-issuers
          patch: |-
            - op: test
              path: /spec/source/helm/parameters/0
              value: {name: route53.hostedZoneID, value: REPLACE_WITH_HOSTED_ZONE_ID}
            - op: replace
              path: /spec/source/helm/parameters/0/value
              value: "__HOSTED_ZONE_ID__"
        - target:
            group: argoproj.io
            kind: Application
            name: nginx-ingress
          patch: |-
            - op: test
              path: /spec/sources/0/helm/parameters/0
              value:
                name: controller.service.annotations.service\.beta\.kubernetes\.io/aws-load-balancer-security-groups
                value: REPLACE_WITH_PUBLIC_INGRESS_SECURITY_GROUP_ID
                forceString: true
            - op: replace
              path: /spec/sources/0/helm/parameters/0/value
              value: "__PUBLIC_INGRESS_SECURITY_GROUP_ID__"
        - target:
            group: argoproj.io
            kind: Application
            name: external-dns
          patch: |-
            - op: test
              path: /spec/sources/0/helm/parameters/0
              value: {name: extraArgs.zone-id-filter, value: REPLACE_WITH_HOSTED_ZONE_ID}
            - op: replace
              path: /spec/sources/0/helm/parameters/0/value
              value: "__HOSTED_ZONE_ID__"
        - target:
            group: argoproj.io
            kind: Application
            name: finsight
          patch: |-
            - op: test
              path: /spec/source/helm/parameters
              value:
                - {name: api.image.repository, value: REPLACE_WITH_API_REPOSITORY_URL}
                - {name: frontend.image.repository, value: REPLACE_WITH_FRONTEND_REPOSITORY_URL}
                - {name: etl.image.repository, value: REPLACE_WITH_ETL_REPOSITORY_URL}
            - op: replace
              path: /spec/source/helm/parameters/0/value
              value: "__API_REPOSITORY_URL__"
            - op: replace
              path: /spec/source/helm/parameters/1/value
              value: "__FRONTEND_REPOSITORY_URL__"
            - op: replace
              path: /spec/source/helm/parameters/2/value
              value: "__ETL_REPOSITORY_URL__"
  syncPolicy:
    automated:
      # A child Application removed from gitops/kustomization.yaml is deleted (its workloads stay).
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
