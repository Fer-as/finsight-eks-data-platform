# App of apps (G08): the child Applications the root Application (argocd/root-application.yaml)
# manages. Each child file is also the single definition of that component; sync waves in the
# files order the bootstrap:
#   0 cert-manager (CRDs)
#   1 aws-load-balancer-controller, cluster-issuers, monitoring (CRDs for ServiceMonitors and rules)
#   2 nginx-ingress (NLB, needs the load balancer controller)
#   3 external-dns
#   4 finsight (needs images in image-tags.yaml and the finsight-database Secret)
# Removing an entry deletes that Application but leaves its workloads running unmanaged (children
# have no resources finalizer); see docs/infrastructure/argocd.md, "Pruning and deletion".
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - platform/cert-manager/application.yaml
  - platform/aws-load-balancer-controller/application.yaml
  - platform/cluster-issuers/application.yaml
  - platform/monitoring/application.yaml
  - platform/nginx-ingress/application.yaml
  - platform/external-dns/application.yaml
  - apps/finsight/application.yaml
