# cert-manager v1.21.2 (chart cert-manager v1.21.2 from https://charts.jetstack.io). The 1.21
# release supports and is tested on Kubernetes 1.33-1.36. See docs/infrastructure/dns-and-certificates.md.
crds:
  enabled: true
  keep: true

# Service account cert-manager in namespace cert-manager: the Pod Identity association in
# Terraform (module cert_manager_role) names exactly these. No IRSA annotation; the AWS SDK
# default chain picks up Pod Identity credentials.
serviceAccount:
  create: true
  name: cert-manager

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

webhook:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 128Mi

cainjector:
  resources:
    requests:
      cpu: 20m
      memory: 128Mi
    limits:
      memory: 256Mi

startupapicheck:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi
