# Argo CD Application for the ClusterIssuers (G04), managed by the root Application (G08, wave 1:
# after cert-manager and its CRDs are healthy). The zone placeholder is replaced by the root
# Application with config dns.zone_id; the chart refuses to render an invalid zone ID.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-issuers
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  source:
    repoURL: https://github.com/Fer-as/finsight-eks-data-platform.git
    targetRevision: main
    path: gitops/platform/cluster-issuers
    helm:
      parameters:
        - name: route53.hostedZoneID
          value: REPLACE_WITH_HOSTED_ZONE_ID
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
