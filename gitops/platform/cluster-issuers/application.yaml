# Argo CD Application for the ClusterIssuers (G04). Apply after cert-manager is healthy. Replace
# the zone placeholder with config dns.zone_id before applying.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-issuers
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  source:
    repoURL: https://github.com/Fer-as/finsight-eks-data-platform.git
    targetRevision: main
    path: gitops/platform/cluster-issuers
    helm:
      parameters:
        - name: route53.hostedZoneID
          value: REPLACE_WITH_HOSTED_ZONE_ID
