# Argo CD Application for the F5 NGINX Ingress Controller (G03.1), managed by the root Application
# (G08, wave 2: after the AWS Load Balancer Controller, which creates the NLB). The security group
# placeholder is replaced by the root Application with the platform output
# network.public_ingress_security_group_id (it changes when the network is recreated). The Service
# must never be created without it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-ingress
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: nginx-ingress
  sources:
    - repoURL: ghcr.io/nginx/charts
      chart: nginx-ingress
      targetRevision: 2.7.3
      helm:
        releaseName: nginx-ingress
        valueFiles:
          - $values/gitops/platform/nginx-ingress/values.yaml
        parameters:
          - name: controller.service.annotations.service\.beta\.kubernetes\.io/aws-load-balancer-security-groups
            value: REPLACE_WITH_PUBLIC_INGRESS_SECURITY_GROUP_ID
            forceString: true
    - repoURL: https://github.com/Fer-as/finsight-eks-data-platform.git
      targetRevision: main
      ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
