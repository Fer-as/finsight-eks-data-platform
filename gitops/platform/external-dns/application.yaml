# Argo CD Application for ExternalDNS (G04), managed by the root Application (G08, wave 3: after
# NGINX has published the NLB address in Ingress status). The zone placeholder is replaced by the
# root Application with config dns.zone_id. policy upsert-only: it only creates or updates records
# under eks.feras-dev.co.uk and never deletes any.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns
  sources:
    - repoURL: https://kubernetes-sigs.github.io/external-dns/
      chart: external-dns
      targetRevision: 1.23.0
      helm:
        releaseName: external-dns
        valueFiles:
          - $values/gitops/platform/external-dns/values.yaml
        parameters:
          - name: extraArgs.zone-id-filter
            value: REPLACE_WITH_HOSTED_ZONE_ID
    - repoURL: https://github.com/Fer-as/finsight-eks-data-platform.git
      targetRevision: main
      ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
