[build-system]
requires = ["setuptools>=75,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "finsight-local"
version = "0.1.0"
description = "FinSight Day 1 API and deterministic financial ETL"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "prometheus-client>=0.21,<1",
  "psycopg[binary]>=3.2,<4",
  "pandas>=2.2,<3",
  "pyarrow>=19,<24",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["apps/api/src", "pipelines/src"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "pipelines/tests", "tests/integration"]
pythonpath = ["apps/api/src", "pipelines/src"]
markers = ["integration: requires a dedicated PostgreSQL test database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
